name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la même branche annule la vérification en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Formatage, lint, types, tests et build
    runs-on: ubuntu-latest

    # Le build prérend le catalogue depuis la base : il lui faut un PostgreSQL rempli.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maison_cadran
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maison_cadran
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatage
        run: npx prettier --check .

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Base de test (migrations et 19 montres)
        run: |
          npm run db:deploy
          npm run db:seed

      - run: npm run build
